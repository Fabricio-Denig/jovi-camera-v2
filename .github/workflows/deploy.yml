name: Deploy

# Publishes the prototype to GitHub Pages, which serves it over HTTPS —
# a hard requirement for getUserMedia to work on a real phone.

on:
  push:
    branches: [main, claude/trusting-heisenberg-7n394b]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Os pesos do Whisper self-hospedado, baixados aqui e publicados junto
      # do site (ver scripts/fetch-whisper-model.mjs).
      #
      # A CHAVE DO CACHE inclui whisperModels.json, e isso não é detalhe: o
      # defeito que travou a transcrição em aparelho real foi exatamente uma
      # divergência entre "qual modelo o app pede" e "qual modelo o CI baixou".
      # Com a lista de modelos fora da chave, trocar de modelo restauraria o
      # cache antigo e publicaria um site sem os pesos que o app pede — de
      # novo. As duas entradas que decidem o que é baixado entram na chave.
      - uses: actions/cache@v4
        with:
          path: public/models
          key: whisper-model-${{ hashFiles('scripts/fetch-whisper-model.mjs', 'src/listen/whisperModels.json') }}
      # O script confere, no fim, que TODO arquivo de TODO modelo existe com
      # bytes dentro — e falha o build se não existir. Um site publicado sem
      # os pesos só aparece no celular, na frente da banca; um build vermelho
      # aparece aqui.
      - run: node scripts/fetch-whisper-model.mjs
      # Artifact separado (não é o que vai para o Pages) só para inspeção:
      # confirmar em CI exatamente quais bytes foram baixados, sem precisar
      # reproduzir o download em nenhum outro lugar.
      - uses: actions/upload-artifact@v4
        with:
          name: whisper-model
          path: public/models
          retention-days: 7
      - run: npm run build
        env:
          GITHUB_PAGES: "true"
      # Requires Pages to be enabled once under Settings › Pages › Source:
      # GitHub Actions. The workflow token can't create the site itself.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    # O ambiente github-pages só aceita a branch padrão, então em qualquer
    # outra branch este job é rejeitado antes de rodar — um X vermelho
    # garantido que não diz nada sobre o código. O build continua rodando e
    # é ele que vale como sinal na PR.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: Deploy

# Publishes the prototype to GitHub Pages, which serves it over HTTPS —
# a hard requirement for getUserMedia to work on a real phone.

on:
  push:
    branches: [main, claude/trusting-heisenberg-7n394b]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Os pesos do Whisper self-hospedado: só o runner do GitHub Actions
      # alcança huggingface.co (o ambiente onde este projeto é trabalhado
      # bloqueia o host por política de rede — ver scripts/fetch-whisper-model.mjs
      # e o comentário em src/listen/whisperEngine.ts). Cacheado entre builds
      # pela chave abaixo: só baixa de novo se o script mudar.
      - uses: actions/cache@v4
        with:
          path: public/models
          key: whisper-model-${{ hashFiles('scripts/fetch-whisper-model.mjs') }}
      - run: node scripts/fetch-whisper-model.mjs
      # Artifact separado (não é o que vai para o Pages) só para inspeção:
      # confirmar em CI exatamente quais bytes foram baixados, sem precisar
      # reproduzir o download em nenhum outro lugar.
      - uses: actions/upload-artifact@v4
        with:
          name: whisper-model
          path: public/models
          retention-days: 7
      - run: npm run build
        env:
          GITHUB_PAGES: "true"
      # Requires Pages to be enabled once under Settings › Pages › Source:
      # GitHub Actions. The workflow token can't create the site itself.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    # O ambiente github-pages só aceita a branch padrão, então em qualquer
    # outra branch este job é rejeitado antes de rodar — um X vermelho
    # garantido que não diz nada sobre o código. O build continua rodando e
    # é ele que vale como sinal na PR.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

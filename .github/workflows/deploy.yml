name: Deploy

# Publishes the prototype to GitHub Pages, which serves it over HTTPS —
# a hard requirement for getUserMedia to work on a real phone.

on:
  push:
    branches: [main, claude/trusting-heisenberg-7n394b]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_PAGES: "true"
      # Requires Pages to be enabled once under Settings › Pages › Source:
      # GitHub Actions. The workflow token can't create the site itself.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    # O ambiente github-pages só aceita a branch padrão, então em qualquer
    # outra branch este job é rejeitado antes de rodar — um X vermelho
    # garantido que não diz nada sobre o código. O build continua rodando e
    # é ele que vale como sinal na PR.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
